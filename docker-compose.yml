# Fast default: Redis + slim API + slim worker (no PyTorch, no Gradio).
# Optional profiles:
#   ui          - Gradio on :7860
#   ocr         - CPU OCR image for scanned PDF routes (rebuilds api + worker)
#   monitoring  - Prometheus on :9090 and Grafana on :3000

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      target: ${DOCINTEL_DOCKER_TARGET:-slim}
    image: docintel-platform:${DOCINTEL_DOCKER_TARGET:-slim}
    ports:
      - "${DOCINTEL_PORT:-5000}:5000"
    environment:
      DOCINTEL_HOST: 0.0.0.0
      DOCINTEL_PORT: 5000
      DOCINTEL_LOG_LEVEL: ${DOCINTEL_LOG_LEVEL:-INFO}
      DOCINTEL_REDIS_URL: redis://redis:6379/0
      DOCINTEL_ASYNC_DEFAULT: ${DOCINTEL_ASYNC_DEFAULT:-true}
      DOCINTEL_PROMETHEUS_ENABLED: ${DOCINTEL_PROMETHEUS_ENABLED:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - docintel_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker:
    image: docintel-platform:${DOCINTEL_DOCKER_TARGET:-slim}
    build:
      context: .
      target: ${DOCINTEL_DOCKER_TARGET:-slim}
    environment:
      DOCINTEL_LOG_LEVEL: ${DOCINTEL_LOG_LEVEL:-INFO}
      DOCINTEL_REDIS_URL: redis://redis:6379/0
      DOCINTEL_UPLOAD_DIR: /app/uploads
    volumes:
      - docintel_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "run_worker.py"]

  ui:
    profiles: [ui]
    build:
      context: .
      target: ui
    image: docintel-platform:ui
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    environment:
      DOCINTEL_API_URL: http://api:5000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "run_ui.py"]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  docintel_uploads:
