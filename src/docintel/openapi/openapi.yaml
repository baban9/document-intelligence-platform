openapi: 3.0.3
info:
  title: Document Intelligence Platform API
  version: 1.1.0
  description: |
    Enterprise document intelligence API for compliance (PII detection), extraction
    (OCR and LLM structuring), and understanding (summarization).

    Long-running tasks support async mode via Redis (`async=true`) and job polling
    at `GET /v1/jobs/{job_id}`.

    Authenticate with `Authorization: Bearer <api_key>` when `DOCINTEL_AUTH_REQUIRED=true`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Babandeep Singh
    url: https://github.com/baban9/document-intelligence-platform

servers:
  - url: http://127.0.0.1:5000
    description: Local development

tags:
  - name: health
  - name: pdf
  - name: documents
  - name: jobs
  - name: batch
  - name: text
  - name: tenants
  - name: ops

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or OIDC JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    JobStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        job_id:
          type: string
        job_type:
          type: string
          enum:
            [
              pdf_structure,
              pdf_detect_sensitive,
              pdf_annotate,
              text_summarize,
              text_classify,
              text_detect_pii,
              document_process,
              batch,
            ]
        job_status:
          type: string
          enum: [queued, running, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        progress_message:
          type: string
        pages_done:
          type: integer
        pages_total:
          type: integer
        download_url:
          type: string
        poll_url:
          type: string
        callback_url:
          type: string
        error:
          type: string
        result:
          type: object

    AsyncAccepted:
      type: object
      properties:
        status:
          type: string
          example: ok
        job_id:
          type: string
        job_type:
          type: string
        job_status:
          type: string
          example: queued
        poll_url:
          type: string
        message:
          type: string

    SummarizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        sentences:
          type: integer
          default: 3
          minimum: 1
          maximum: 20

    DocumentType:
      type: object
      properties:
        kind:
          type: string
          enum: [pdf, docx, xlsx, csv, plain_text, json]
        mime_type:
          type: string
        extensions:
          type: array
          items:
            type: string
        label:
          type: string
        capabilities:
          type: object
          properties:
            pdf_pipeline:
              type: boolean
            text_extraction:
              type: boolean

    ClassifyRequest:
      type: object
      properties:
        text:
          type: string

    CompareRequest:
      type: object
      required: [text_a, text_b]
      properties:
        text_a:
          type: string
        text_b:
          type: string

    DetectPiiRequest:
      type: object
      properties:
        text:
          type: string
        entities:
          type: string
          description: Comma-separated Presidio entity types
        vertical:
          type: string
          enum: [general, healthcare, financial, legal]
        min_score:
          type: number
          default: 0.35

    AnalyzeIntegrityRequest:
      type: object
      properties:
        text:
          type: string
        checks:
          type: array
          description: Optional subset of v1 integrity checks
          items:
            type: string
            enum:
              - placeholders
              - broken_references
              - name_drift
              - number_mismatch
              - structural_gaps

    IntegrityFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [high, medium, low]
        category:
          type: string
          enum:
            - placeholder
            - broken_reference
            - name_drift
            - number_mismatch
            - structural_gap
        description:
          type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              quote:
                type: string
              start:
                type: integer
              end:
                type: integer
              context:
                type: string
        suggested_fix:
          type: string

    IntegrityAnalysisResponse:
      type: object
      properties:
        status:
          type: string
        finding_count:
          type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/IntegrityFinding"
        summary:
          type: object
        checks_run:
          type: array
          items:
            type: string

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy

  /openapi.json:
    get:
      tags: [ops]
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: OpenAPI 3 document

  /docs:
    get:
      tags: [ops]
      summary: Swagger UI
      security: []
      responses:
        "200":
          description: Interactive API documentation

  /metrics:
    get:
      tags: [ops]
      summary: Request metrics
      security: []
      responses:
        "200":
          description: In-process metrics snapshot

  /v1/pdf/annotate:
    post:
      tags: [pdf]
      summary: Regex search and annotate a PDF
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
          description: Queue job and return 202 when true
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, pattern]
              properties:
                file:
                  type: string
                  format: binary
                pattern:
                  type: string
                action:
                  type: string
                  enum: [Highlight, Redact, Frame, Underline, Squiggly, Strikeout, Remove]
                pages:
                  type: string
                  description: Comma-separated zero-based page indexes
                format:
                  type: string
                  enum: [file, json]
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Annotated PDF or JSON metadata
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "400":
          description: Invalid request

  /v1/pdf/entities:
    get:
      tags: [pdf]
      summary: List Presidio entity types
      responses:
        "200":
          description: Supported entities

  /v1/pdf/presets:
    get:
      tags: [pdf]
      summary: List vertical Presidio entity packs
      responses:
        "200":
          description: Vertical preset map

  /v1/pdf/detect-sensitive:
    post:
      tags: [pdf]
      summary: Detect PII and annotate PDF (OCR + Presidio)
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
          description: Queue job and return 202 when true
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                action:
                  type: string
                entities:
                  type: string
                  description: Comma-separated Presidio entity types
                pattern:
                  type: string
                force_ocr:
                  type: boolean
                add_text_layer:
                  type: boolean
                min_score:
                  type: number
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Processed PDF or JSON report
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/pdf/structure:
    post:
      tags: [pdf]
      summary: Structure scanned PDF with OCR and LLM
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [curate, searchable]
                force_ocr:
                  type: boolean
                redact_before_llm:
                  type: boolean
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Structured PDF or JSON metadata
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/pdf/files/{job_id}/{filename}:
    get:
      tags: [pdf]
      summary: Download a generated PDF
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: File not found

  /v1/documents/types:
    get:
      tags: [documents]
      summary: List supported document formats and capabilities
      responses:
        "200":
          description: Supported MIME types and extensions

  /v1/documents/identify:
    post:
      tags: [documents]
      summary: Detect document kind from an upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Detected document profile
        "400":
          description: Missing upload

  /v1/documents/extract-text:
    post:
      tags: [documents]
      summary: Extract plain text from PDF, Word, Excel, CSV, JSON, or text files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted text and segments
        "415":
          description: Unsupported document kind

  /v1/documents/classify:
    post:
      tags: [documents]
      summary: Classify text or an uploaded document
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
      responses:
        "200":
          description: Category scores

  /v1/documents/summarize:
    post:
      tags: [documents]
      summary: Summarize text or an uploaded document
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SummarizeRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
                sentences:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "200":
          description: Extractive summary

  /v1/documents/detect-pii:
    post:
      tags: [documents]
      summary: Detect Presidio PII in text or an uploaded document
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectPiiRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
                entities:
                  type: string
                vertical:
                  type: string
                  enum: [general, healthcare, financial, legal]
                min_score:
                  type: number
      responses:
        "200":
          description: PII findings
        "503":
          description: Presidio stack unavailable

  /v1/documents/analyze-integrity:
    post:
      tags: [documents]
      summary: Document integrity analysis
      description: |
        Detect placeholders, broken cross-references, naming drift, labeled number
        mismatches, and thin section structure across a document. Returns ranked
        findings with evidence spans. Supports sync or async (`?async=true`).
      parameters:
        - in: query
          name: async
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeIntegrityRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
                checks:
                  type: string
                  description: Comma-separated integrity checks
      responses:
        "200":
          description: Integrity findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityAnalysisResponse"
        "202":
          description: Async job accepted

  /v1/documents/ingest:
    post:
      tags: [documents]
      summary: Queue process pipeline for an S3 object
      description: |
        Downloads the object in the worker, then runs the same pipeline as
        POST /v1/documents/process. Always returns 202 when Redis is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                s3_uri:
                  type: string
                  example: s3://my-bucket/inbox/policy.docx
                bucket:
                  type: string
                key:
                  type: string
                operation:
                  type: string
                  enum: [process]
                  default: process
                sentences:
                  type: integer
                  minimum: 1
                  maximum: 20
                include_summarize:
                  type: boolean
                  default: true
                include_pii:
                  type: boolean
                  default: true
                include_text:
                  type: boolean
                  default: false
                vertical:
                  type: string
                entities:
                  type: string
                min_score:
                  type: number
                callback_url:
                  type: string
                  format: uri
      responses:
        "202":
          description: S3 ingest job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "400":
          description: Invalid S3 location or options
        "503":
          description: Async jobs unavailable

  /v1/documents/process:
    post:
      tags: [documents]
      summary: Unified pipeline (extract, classify, summarize, PII)
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
          description: Queue job and return 202 when true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                sentences:
                  type: integer
                  minimum: 1
                  maximum: 20
                include_summarize:
                  type: boolean
                  default: true
                include_pii:
                  type: boolean
                  default: true
                include_text:
                  type: boolean
                  default: false
                vertical:
                  type: string
                  enum: [general, healthcare, financial, legal]
                entities:
                  type: string
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Full processing report
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "415":
          description: Unsupported document

  /v1/documents/compare:
    post:
      tags: [documents]
      summary: Compare two documents or text bodies for overlap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file_a:
                  type: string
                  format: binary
                file_b:
                  type: string
                  format: binary
                text_a:
                  type: string
                text_b:
                  type: string
      responses:
        "200":
          description: Similarity and shared terms

  /v1/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Poll async job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found

  /v1/batch:
    post:
      tags: [batch]
      summary: Queue multiple async text document jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                callback_url:
                  type: string
                  format: uri
                items:
                  type: array
                  items:
                    type: object
                    required: [operation, text]
                    properties:
                      operation:
                        type: string
                        enum: [summarize, classify, detect_pii, process]
                      text:
                        type: string
                      sentences:
                        type: integer
                        default: 3
                      include_summarize:
                        type: boolean
                      include_pii:
                        type: boolean
                      vertical:
                        type: string
                        enum: [general, healthcare, financial, legal]
                      entities:
                        type: string
                      min_score:
                        type: number
      responses:
        "202":
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/text/summarize:
    post:
      tags: [text]
      summary: Extractive TextRank summarization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeRequest"
      responses:
        "200":
          description: Summary sentences

  /v1/tenants:
    get:
      tags: [tenants]
      summary: List tenants visible to the current tenant
      parameters:
        - in: header
          name: X-Tenant-Slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant list
        "403":
          description: Access denied

  /v1/tenants/{slug}/settings:
    get:
      tags: [tenants]
      summary: Get tenant LLM and PII settings
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant settings
        "403":
          description: Access denied
        "404":
          description: Tenant not found
    put:
      tags: [tenants]
      summary: Update tenant LLM and PII settings
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                llm_provider:
                  type: string
                  enum: [ollama, groq, gemini, openai]
                llm_model:
                  type: string
                llm_base_url:
                  type: string
                llm_api_key:
                  type: string
                pii_entities:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated settings
        "403":
          description: Access denied
        "404":
          description: Tenant not found

  /v1/tenants/{slug}/settings/api-key:
    get:
      tags: [tenants]
      summary: Reveal stored LLM API key (owner only)
      description: |
        Returns the decrypted API key only when X-Settings-User-Id matches the browser
        user who saved the key. Admin and other users receive 403.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Slug
          required: true
          schema:
            type: string
        - in: header
          name: X-Settings-User-Id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decrypted API key for the owner
        "403":
          description: Not the key owner
        "404":
          description: Tenant or key not found

  /v1/tenants/llm/models:
    get:
      tags: [tenants]
      summary: List LLM models for a provider
      description: |
        Fetches live model ids from the provider API when an API key is available
        (query param, tenant settings, or server env). Falls back to defaults on error.
      parameters:
        - in: query
          name: provider
          schema:
            type: string
            enum: [ollama, groq, gemini, openai]
        - in: query
          name: base_url
          schema:
            type: string
        - in: query
          name: api_key
          schema:
            type: string
          description: Optional key from the settings form (not stored until save).
        - in: query
          name: tenant_slug
          schema:
            type: string
          description: Tenant whose stored key should be used when api_key is empty.
      responses:
        "200":
          description: Model names with source label (groq, gemini, ollama, fallback, etc.)
        "400":
          description: Unsupported provider
        "403":
          description: Access denied for tenant_slug

  /v1/tenants/pii/entities:
    get:
      tags: [tenants]
      summary: List supported Presidio entity types
      responses:
        "200":
          description: Entity type names
