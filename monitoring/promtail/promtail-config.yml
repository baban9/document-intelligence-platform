# Scrapes JSON logs from Docker containers and ships them to Loki.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docintel-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_compose_project"]
        target_label: compose_project
      - action: keep
        source_labels: [service]
        regex: "(api|worker|ui|redis)"
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            job_id: job_id
            job_type: job_type
            event: event
      - labels:
          level:
          logger:
          job_type:
          event:
