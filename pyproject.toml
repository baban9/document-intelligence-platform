[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-platform"
version = "2.0.0"
description = "Enterprise document intelligence API for PDF compliance, multi-format extraction, structuring, and summarization."
readme = "README.md"
license = "MIT"
license-files = []
requires-python = ">=3.9"
authors = [{name = "Babandeep Singh"}]
keywords = [
    "nlp", "pdf", "flask", "document-ai",
    "ocr", "pii", "presidio", "openapi", "document-intelligence", "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "flask>=3.0.3",
    "werkzeug>=3.0.3",
    "pymupdf>=1.24.10",
    "scikit-learn>=1.5.2",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "gunicorn>=23.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "build>=1.2.2",
    "twine>=5.1.1",
    "fakeredis>=2.26.2",
    "prometheus-client>=0.21.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]
documents = [
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]
pii = [
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7.0",
]
# Scanned PDF OCR (EasyOCR). In Docker, torch and torchvision are pinned in requirements/docker-base-torch.txt.
ocr = [
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.10.0",
]
llm = [
    "openai>=1.54.0",
]
jobs = [
    "redis>=5.0.8",
    "rq>=1.16.2",
]
storage = [
    "boto3>=1.35.0",
]
auth = [
    "flask-limiter>=3.8.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
]
db = [
    "psycopg2-binary>=2.9.9",
    "cryptography>=43.0.0",
]
all = [
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.10.0",
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7.0",
    "openai>=1.54.0",
    "redis>=5.0.8",
    "rq>=1.16.2",
    "boto3>=1.35.0",
    "prometheus-client>=0.21.0",
    "flask-limiter>=3.8.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
docintel = "docintel.cli:main"

[project.urls]
Homepage = "https://github.com/baban9/document-intelligence-platform"
Repository = "https://github.com/baban9/document-intelligence-platform"
Documentation = "https://github.com/baban9/document-intelligence-platform#readme"
Issues = "https://github.com/baban9/document-intelligence-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docintel = ["openapi/*.yaml", "db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
