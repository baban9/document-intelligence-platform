# Redis + slim API + worker + React UI (nginx).
# Optional: set DOCINTEL_DOCKER_TARGET=ocr for scanned PDF OCR (rebuilds api + worker).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      target: ${DOCINTEL_DOCKER_TARGET:-slim}
    image: docintel-platform:${DOCINTEL_DOCKER_TARGET:-slim}
    ports:
      - "${DOCINTEL_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCINTEL_HOST: 0.0.0.0
      DOCINTEL_PORT: 5000
      DOCINTEL_LOG_LEVEL: ${DOCINTEL_LOG_LEVEL:-INFO}
      DOCINTEL_REDIS_URL: redis://redis:6379/0
      DOCINTEL_ASYNC_DEFAULT: ${DOCINTEL_ASYNC_DEFAULT:-true}
      DOCINTEL_PROMETHEUS_ENABLED: ${DOCINTEL_PROMETHEUS_ENABLED:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DOCINTEL_LLM_PROVIDER: ${DOCINTEL_LLM_PROVIDER:-ollama}
      DOCINTEL_LLM_MODEL: ${DOCINTEL_LLM_MODEL:-}
      DOCINTEL_LLM_API_KEY: ${DOCINTEL_LLM_API_KEY:-}
      DOCINTEL_LLM_BASE_URL: ${DOCINTEL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - docintel_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker:
    image: docintel-platform:${DOCINTEL_DOCKER_TARGET:-slim}
    build:
      context: .
      target: ${DOCINTEL_DOCKER_TARGET:-slim}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCINTEL_LOG_LEVEL: ${DOCINTEL_LOG_LEVEL:-INFO}
      DOCINTEL_REDIS_URL: redis://redis:6379/0
      DOCINTEL_UPLOAD_DIR: /app/uploads
      DOCINTEL_LLM_PROVIDER: ${DOCINTEL_LLM_PROVIDER:-ollama}
      DOCINTEL_LLM_MODEL: ${DOCINTEL_LLM_MODEL:-}
      DOCINTEL_LLM_API_KEY: ${DOCINTEL_LLM_API_KEY:-}
      DOCINTEL_LLM_BASE_URL: ${DOCINTEL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - docintel_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "run_worker.py"]

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: docintel-platform:web
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  docintel_uploads:
