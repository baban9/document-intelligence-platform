[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.9.0"
description = "Document intelligence platform: PDF annotation, resume matching, and text summarization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Babandeep Singh"}]
keywords = ["nlp", "pdf", "flask", "document-ai", "resume-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "Topic :: Text Processing",
]
dependencies = [
    "flask>=3.0.3",
    "werkzeug>=3.0.3",
    "pymupdf>=1.24.10",
    "scikit-learn>=1.5.2",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "build>=1.2.2",
    "fakeredis>=2.26.2",
]
ocr = [
    "easyocr>=1.7.2",
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7.0",
    "opencv-python-headless>=4.10.0",
    "torch>=2.4.1",
]
ui = [
    "gradio>=4.44.0",
    "requests>=2.32.3",
]
llm = [
    "openai>=1.54.0",
]
jobs = [
    "redis>=5.0.8",
    "rq>=1.16.2",
]
auth = [
    "flask-limiter>=3.8.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
]

[project.scripts]
docintel = "docintel.cli:main"
docintel-ui = "docintel.ui:launch_ui"

[project.urls]
Homepage = "https://github.com/baban9/document-intelligence-platform"
Repository = "https://github.com/baban9/document-intelligence-platform"
Issues = "https://github.com/baban9/document-intelligence-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
