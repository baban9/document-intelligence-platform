# Reference Prometheus config. Use scrape-config.example.yml in your deployment.
# Target api:5000 assumes Prometheus runs on the same Docker network as the API service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: docintel-api
    metrics_path: /metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["api:5000"]
        labels:
          service: docintel-api
