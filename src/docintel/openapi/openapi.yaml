openapi: 3.0.3
info:
  title: Document Intelligence Platform API
  version: 1.0.2
  description: |
    Enterprise document intelligence API for compliance (PII detection), extraction
    (OCR and LLM structuring), and understanding (summarization).

    Long-running tasks support async mode via Redis (`async=true`) and job polling
    at `GET /v1/jobs/{job_id}`.

    Authenticate with `Authorization: Bearer <api_key>` when `DOCINTEL_AUTH_REQUIRED=true`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Babandeep Singh
    url: https://github.com/baban9/document-intelligence-platform

servers:
  - url: http://127.0.0.1:5000
    description: Local development

tags:
  - name: health
  - name: pdf
  - name: documents
  - name: jobs
  - name: batch
  - name: text
  - name: ops

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or OIDC JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    JobStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        job_id:
          type: string
        job_type:
          type: string
          enum: [pdf_structure, pdf_detect_sensitive, pdf_annotate, text_summarize, batch]
        job_status:
          type: string
          enum: [queued, running, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        progress_message:
          type: string
        pages_done:
          type: integer
        pages_total:
          type: integer
        download_url:
          type: string
        poll_url:
          type: string
        callback_url:
          type: string
        error:
          type: string
        result:
          type: object

    AsyncAccepted:
      type: object
      properties:
        status:
          type: string
          example: ok
        job_id:
          type: string
        job_type:
          type: string
        job_status:
          type: string
          example: queued
        poll_url:
          type: string
        message:
          type: string

    SummarizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        sentences:
          type: integer
          default: 3
          minimum: 1
          maximum: 20

    DocumentType:
      type: object
      properties:
        kind:
          type: string
          enum: [pdf, docx, xlsx, csv, plain_text, json]
        mime_type:
          type: string
        extensions:
          type: array
          items:
            type: string
        label:
          type: string
        capabilities:
          type: object
          properties:
            pdf_pipeline:
              type: boolean
            text_extraction:
              type: boolean

    ClassifyRequest:
      type: object
      properties:
        text:
          type: string

    CompareRequest:
      type: object
      required: [text_a, text_b]
      properties:
        text_a:
          type: string
        text_b:
          type: string

    DetectPiiRequest:
      type: object
      properties:
        text:
          type: string
        entities:
          type: string
          description: Comma-separated Presidio entity types
        vertical:
          type: string
          enum: [general, healthcare, financial, legal]
        min_score:
          type: number
          default: 0.35

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy

  /openapi.json:
    get:
      tags: [ops]
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: OpenAPI 3 document

  /docs:
    get:
      tags: [ops]
      summary: Swagger UI
      security: []
      responses:
        "200":
          description: Interactive API documentation

  /metrics:
    get:
      tags: [ops]
      summary: Request metrics
      security: []
      responses:
        "200":
          description: In-process metrics snapshot

  /v1/pdf/annotate:
    post:
      tags: [pdf]
      summary: Regex search and annotate a PDF
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
          description: Queue job and return 202 when true
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, pattern]
              properties:
                file:
                  type: string
                  format: binary
                pattern:
                  type: string
                action:
                  type: string
                  enum: [Highlight, Redact, Frame, Underline, Squiggly, Strikeout, Remove]
                pages:
                  type: string
                  description: Comma-separated zero-based page indexes
                format:
                  type: string
                  enum: [file, json]
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Annotated PDF or JSON metadata
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "400":
          description: Invalid request

  /v1/pdf/entities:
    get:
      tags: [pdf]
      summary: List Presidio entity types
      responses:
        "200":
          description: Supported entities

  /v1/pdf/presets:
    get:
      tags: [pdf]
      summary: List vertical Presidio entity packs
      responses:
        "200":
          description: Vertical preset map

  /v1/pdf/detect-sensitive:
    post:
      tags: [pdf]
      summary: Detect PII and annotate PDF (OCR + Presidio)
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
          description: Queue job and return 202 when true
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                action:
                  type: string
                entities:
                  type: string
                  description: Comma-separated Presidio entity types
                pattern:
                  type: string
                force_ocr:
                  type: boolean
                add_text_layer:
                  type: boolean
                min_score:
                  type: number
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Processed PDF or JSON report
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/pdf/structure:
    post:
      tags: [pdf]
      summary: Structure scanned PDF with OCR and LLM
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          schema:
            type: string
            enum: [file, json]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [curate, searchable]
                force_ocr:
                  type: boolean
                redact_before_llm:
                  type: boolean
                callback_url:
                  type: string
                  format: uri
                async:
                  type: boolean
      responses:
        "200":
          description: Structured PDF or JSON metadata
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/pdf/files/{job_id}/{filename}:
    get:
      tags: [pdf]
      summary: Download a generated PDF
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: File not found

  /v1/documents/types:
    get:
      tags: [documents]
      summary: List supported document formats and capabilities
      responses:
        "200":
          description: Supported MIME types and extensions

  /v1/documents/identify:
    post:
      tags: [documents]
      summary: Detect document kind from an upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Detected document profile
        "400":
          description: Missing upload

  /v1/documents/extract-text:
    post:
      tags: [documents]
      summary: Extract plain text from PDF, Word, Excel, CSV, JSON, or text files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted text and segments
        "415":
          description: Unsupported document kind

  /v1/documents/classify:
    post:
      tags: [documents]
      summary: Classify text or an uploaded document
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
      responses:
        "200":
          description: Category scores

  /v1/documents/summarize:
    post:
      tags: [documents]
      summary: Summarize text or an uploaded document
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SummarizeRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
                sentences:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "200":
          description: Extractive summary

  /v1/documents/compare:
    post:
      tags: [documents]
      summary: Compare two documents or text bodies for overlap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file_a:
                  type: string
                  format: binary
                file_b:
                  type: string
                  format: binary
                text_a:
                  type: string
                text_b:
                  type: string
      responses:
        "200":
          description: Similarity and shared terms

  /v1/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Poll async job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found

  /v1/batch:
    post:
      tags: [batch]
      summary: Queue multiple async summarization jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                callback_url:
                  type: string
                  format: uri
                items:
                  type: array
                  items:
                    type: object
                    required: [operation, text]
                    properties:
                      operation:
                        type: string
                        enum: [summarize]
                      text:
                        type: string
                      sentences:
                        type: integer
                        default: 3
      responses:
        "202":
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"

  /v1/text/summarize:
    post:
      tags: [text]
      summary: Extractive TextRank summarization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeRequest"
      responses:
        "200":
          description: Summary sentences
